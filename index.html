<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANPEDROLEE - Plataforma de Comprensión Lectora</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .hidden { display: none !important; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .modal-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .reading-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .reading-text {
            border: 2px dashed #93c5fd;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .question-card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .tag-tipo {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .tag-Literal { background-color: #2563eb; }
        .tag-Inferencial { background-color: #d97706; }
        .tag-Criterial { background-color: #059669; }

        .option-label {
            display: block;
            margin: 6px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANEL DE LOGIN -->
    <div id="sec-login" class="card">
        <h2>Ingreso a SANPEDROLEE</h2>
        <label>Usuario:</label>
        <input type="text" id="user" placeholder="Ingresa tu DNI o usuario">
        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Ingresa tu contraseña">
        <button onclick="login()">Iniciar Sesión</button>
    </div>

    <!-- PANEL PRINCIPAL (NIVELES) -->
    <div id="sec-main" class="card hidden">
        <h2 id="welcome-msg">Bienvenido</h2>
        <p>Selecciona tu nivel para comenzar:</p>
        <div id="levels-grid"></div>
    </div>
</div>

<!-- MODAL DE LECTURA -->
<div id="modal-lectura" class="modal-bg hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h2 id="modal-reading-title">Cargando...</h2>
        
        <div id="modal-reading-text" class="reading-text"></div>
        
        <form id="form-preguntas"></form>
        
        <button id="btn-submit" onclick="enviarRespuestas()" class="hidden">Enviar Respuestas</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT_AQUI"; // Reemplaza con tu Executable URL
    let currentUser = "";
    let currentNivel = 1;
    let preguntasCargadas = [];

    function jsonp(url) {
        return new Promise((resolve) => {
            const callbackName = 'jp_' + Math.round(100000 * Math.random());
            window[callbackName] = (data) => {
                delete window[callbackName];
                document.body.removeChild(script);
                resolve(data);
            };
            const script = document.createElement('script');
            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            document.body.appendChild(script);
        });
    }

    async function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(!u || !p) return alert("Completa los campos");

        const res = await jsonp(`${SCRIPT_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
        if(res.status === "success") {
            currentUser = u;
            currentNivel = parseInt(res.nivel);
            document.getElementById('welcome-msg').innerText = `¡Hola, ${res.nombreEstudiante}!`;
            document.getElementById('sec-login').classList.add('hidden');
            document.getElementById('sec-main').classList.remove('hidden');
            renderNiveles();
        } else {
            alert(res.message);
        }
    }

    function renderNiveles() {
        const grid = document.getElementById('levels-grid');
        grid.innerHTML = "";
        for(let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.style.margin = "5px";
            btn.style.width = "auto";
            btn.innerText = `Nivel ${i}`;
            if(i > currentNivel) {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            } else {
                btn.onclick = () => abrirNivel(i);
            }
            grid.appendChild(btn);
        }
    }

    async function abrirNivel(n) {
        document.getElementById('modal-lectura').classList.remove('hidden');
        document.getElementById('modal-reading-title').innerText = "Cargando lectura...";
        document.getElementById('modal-reading-text').innerHTML = "";
        document.getElementById('form-preguntas').innerHTML = "";
        document.getElementById('btn-submit').classList.add('hidden');

        const data = await jsonp(`${SCRIPT_URL}?action=getLectura&nivel=${n}`);
        
        if(data.status === "success") {
            document.getElementById('modal-reading-title').innerText = `Nivel ${n}: ${data.titulo}`;
            
            let htmlContenido = "";
            if (data.imagen && data.imagen.trim() !== "") {
                htmlContenido += `<img src="${data.imagen}" class="reading-img" alt="Imagen del texto">`;
            }
            htmlContenido += data.texto;
            document.getElementById('modal-reading-text').innerHTML = htmlContenido;

            preguntasCargadas = data.preguntas;
            const form = document.getElementById('form-preguntas');
            
            preguntasCargadas.forEach((p, idx) => {
                const qDiv = document.createElement('div');
                qDiv.className = "question-card";
                
                let optionsHTML = p.ops.map((op, opIdx) => `
                    <label class="option-label">
                        <input type="radio" name="q_${idx}" value="${opIdx}"> ${op}
                    </label>
                `).join('');

                qDiv.innerHTML = `
                    <span class="tag-tipo tag-${p.tipo}">${p.tipo}</span>
                    <p><strong>${idx + 1}. ${p.q}</strong></p>
                    ${optionsHTML}
                `;
                form.appendChild(qDiv);
            });

            document.getElementById('btn-submit').classList.remove('hidden');
        } else {
            alert(data.message);
            cerrarModal();
        }
    }

    async function enviarRespuestas() {
        let respuestas = [];
        for(let i = 0; i < preguntasCargadas.length; i++) {
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            if(!selected) return alert(`Por favor responde la pregunta ${i + 1}`);
            respuestas.push(parseInt(selected.value));
        }

        const res = await jsonp(`${SCRIPT_URL}?action=evaluar&user=${encodeURIComponent(currentUser)}&nivel=${currentNivel}&respuestas=${JSON.stringify(respuestas)}`);
        
        if(res.status === "success") {
            if(res.correctas === 5) {
                alert(`¡Excelente! Respondiste 5/5 correctas. Has desbloqueado el siguiente nivel.`);
                currentNivel++;
                renderNiveles();
            } else {
                alert(`Obtuviste ${res.correctas}/5 correctas. Debes acertar todas las preguntas para pasar de nivel. ¡Vuelve a intentarlo!`);
            }
            cerrarModal();
        }
    }

    function cerrarModal() {
        document.getElementById('modal-lectura').classList.add('hidden');
    }
</script>
</body>
</html>
