<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANPEDROLEE - Plataforma de Comprensión Lectora</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .hidden { display: none !important; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .modal-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #64748b;
        }

        .reading-text {
            border: 2px dashed #93c5fd;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .question-card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .tag-tipo {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .tag-Literal { background-color: #2563eb; }
        .tag-Inferencial { background-color: #d97706; }
        .tag-Criterial { background-color: #059669; }

        .option-label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="sec-login" class="card">
        <h2>Ingreso a SANPEDROLEE</h2>
        <label for="user">Usuario:</label>
        <input type="text" id="user" placeholder="Ingresa tu usuario o DNI">
        <label for="pass">Contraseña:</label>
        <input type="password" id="pass" placeholder="Ingresa tu contraseña">
        <button id="btn-login" onclick="login()">Iniciar Sesión</button>
    </div>

    <div id="sec-main" class="card hidden">
        <h2 id="welcome-msg">Bienvenido</h2>
        <p>Selecciona tu nivel para comenzar:</p>
        <div id="levels-grid" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>
</div>

<div id="modal-lectura" class="modal-bg hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h2 id="modal-reading-title">Cargando...</h2>
        
        <div id="modal-reading-text" class="reading-text"></div>
        
        <form id="form-preguntas"></form>
        
        <button id="btn-submit" onclick="enviarRespuestas()" class="hidden" style="margin-top: 15px;">Enviar Respuestas</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFRw66q7CfQSAzkbBE1HttpZh2LoCxna3g7PWzAcApE4y-kBQZ330CZhKkNRL3KmnvNg/exec";

    let currentUser = "";
    let currentNivel = 1;
    let preguntasCargadas = [];

    function jsonp(url, timeoutMs = 12000) {
        return new Promise((resolve, reject) => {
            const callbackName = 'jp_' + Math.round(100000 * Math.random());
            const script = document.createElement('script');

            const timeoutId = setTimeout(() => {
                cleanUp();
                reject(new Error("Tiempo de espera agotado"));
            }, timeoutMs);

            function cleanUp() {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                clearTimeout(timeoutId);
            }

            window[callbackName] = (data) => {
                cleanUp();
                resolve(data);
            };

            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            script.onerror = () => {
                cleanUp();
                reject(new Error("Error de red al conectar con el servidor"));
            };

            document.body.appendChild(script);
        });
    }

    async function login() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const btnLogin = document.getElementById('btn-login');

        if(!u || !p) return alert("Por favor ingresa usuario y contraseña");

        btnLogin.disabled = true;
        btnLogin.innerText = "Verificando...";

        try {
            const res = await jsonp(`${SCRIPT_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
            
            if(res.status === "success") {
                currentUser = u;
                currentNivel = parseInt(res.nivel);
                document.getElementById('welcome-msg').innerText = `¡Hola, ${res.nombreEstudiante}!`;
                document.getElementById('sec-login').classList.add('hidden');
                document.getElementById('sec-main').classList.remove('hidden');
                renderNiveles();
            } else {
                alert(res.message);
            }
        } catch(e) {
            alert("Error al conectar con el servidor.");
        } finally {
            btnLogin.disabled = false;
            btnLogin.innerText = "Iniciar Sesión";
        }
    }

    function renderNiveles() {
        const grid = document.getElementById('levels-grid');
        grid.innerHTML = "";
        for(let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.style.width = "calc(20% - 8px)";
            btn.style.minWidth = "80px";
            btn.innerText = `Nivel ${i}`;
            
            if(i > currentNivel) {
                btn.disabled = true;
                btn.style.opacity = "0.4";
                btn.style.cursor = "not-allowed";
            } else {
                btn.onclick = () => abrirNivel(i);
            }
            grid.appendChild(btn);
        }
    }

    async function abrirNivel(n) {
        document.getElementById('modal-lectura').classList.remove('hidden');
        document.getElementById('modal-reading-title').innerText = "Cargando lectura...";
        document.getElementById('modal-reading-text').innerHTML = "";
        document.getElementById('form-preguntas').innerHTML = "";
        document.getElementById('btn-submit').classList.add('hidden');

        try {
            const data = await jsonp(`${SCRIPT_URL}?action=getLectura&nivel=${n}`);
            
            if(data.status === "success") {
                document.getElementById('modal-reading-title').innerText = `Nivel ${n}: ${data.titulo}`;
                document.getElementById('modal-reading-text').innerHTML = data.texto;

                preguntasCargadas = data.preguntas;
                const form = document.getElementById('form-preguntas');
                
                preguntasCargadas.forEach((p, idx) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = "question-card";
                    
                    let optionsHTML = p.ops.map((op, opIdx) => `
                        <label class="option-label">
                            <input type="radio" name="q_${idx}" value="${opIdx}"> ${op}
                        </label>
                    `).join('');

                    qDiv.innerHTML = `
                        <span class="tag-tipo tag-${p.tipo || 'Literal'}">${p.tipo || 'Literal'}</span>
                        <p style="margin: 5px 0 10px 0;"><strong>${idx + 1}. ${p.q}</strong></p>
                        ${optionsHTML}
                    `;
                    form.appendChild(qDiv);
                });

                document.getElementById('btn-submit').classList.remove('hidden');
            } else {
                alert(data.message);
                cerrarModal();
            }
        } catch(e) {
            alert("Error al cargar la lectura.");
            cerrarModal();
        }
    }

    async function enviarRespuestas() {
        let aciertos = 0;
        
        for(let i = 0; i < preguntasCargadas.length; i++) {
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            if(!selected) return alert(`Por favor responde la pregunta ${i + 1}`);
            
            // Compara el índice marcado con la opción correcta que viene del Apps Script
            if(parseInt(selected.value) === parseInt(preguntasCargadas[i].correcta)) {
                aciertos++;
            }
        }

        const btnSub = document.getElementById('btn-submit');
        btnSub.disabled = true;
        btnSub.innerText = "Guardando...";

        if(aciertos === 5) {
            try {
                // Notifica al servidor para subir de nivel
                await jsonp(`${SCRIPT_URL}?action=subirNivel&user=${encodeURIComponent(currentUser)}&nivel=${currentNivel}`);
                alert("¡Excelente! Respondiste 5/5 correctas. Has desbloqueado el siguiente nivel.");
                currentNivel++;
                renderNiveles();
                cerrarModal();
            } catch(e) {
                alert("Error al actualizar el nivel.");
            }
        } else {
            alert(`Obtuviste ${aciertos}/5 correctas. Debes lograr 5/5 para avanzar de nivel. ¡Inténtalo de nuevo!`);
        }

        btnSub.disabled = false;
        btnSub.innerText = "Enviar Respuestas";
    }

    function cerrarModal() {
        document.getElementById('modal-lectura').classList.add('hidden');
    }
</script>
</body>
</html>
