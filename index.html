<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANPEDROLEE - Plataforma de Comprensión Lectora</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .hidden { display: none !important; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .modal-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            color: #64748b;
        }

        .reading-text {
            border: 2px dashed #93c5fd;
            padding: 15px;
            border-radius: 8px;
            background: #eff6ff;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .question-card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .tag-tipo {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .tag-Literal { background-color: #2563eb; }
        .tag-Inferencial { background-color: #d97706; }
        .tag-Criterial { background-color: #059669; }

        .option-label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }

        /* ESTILOS PARA POPUPS CUSTOM */
        .popup-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2001;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* CANVAS DE FUEGOS ARTIFICIALES */
        #fx-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>

<canvas id="fx-canvas" class="hidden"></canvas>

<div class="container">
    <div id="sec-login" class="card">
        <h2>Ingreso a SANPEDROLEE</h2>
        <label for="user">Usuario:</label>
        <input type="text" id="user" placeholder="Ingresa tu usuario o DNI">
        <label for="pass">Contraseña:</label>
        <input type="password" id="pass" placeholder="Ingresa tu contraseña">
        <button id="btn-login" onclick="login()">Iniciar Sesión</button>
    </div>

    <div id="sec-main" class="card hidden">
        <h2 id="welcome-msg">Bienvenido</h2>
        <p>Selecciona tu nivel para comenzar:</p>
        <div id="levels-grid" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>
</div>

<!-- MODAL LECTURA -->
<div id="modal-lectura" class="modal-bg hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="cerrarModal()">&times;</span>
        <h2 id="modal-reading-title">Cargando...</h2>
        
        <div id="modal-reading-text" class="reading-text"></div>
        
        <form id="form-preguntas"></form>
        
        <button id="btn-submit" onclick="enviarRespuestas()" class="hidden" style="margin-top: 15px;">Enviar Respuestas</button>
    </div>
</div>

<!-- POPUP DE RESULTADO -->
<div id="modal-result" class="modal-bg hidden" style="z-index: 2000;">
    <div id="result-card" class="popup-card">
        <div id="result-icon" style="font-size: 50px; margin-bottom: 10px;">🎉</div>
        <h2 id="result-title" style="margin: 0 0 10px 0; color: #1e293b;">¡Felicitaciones!</h2>
        <p id="result-msg" style="color: #64748b; font-size: 16px; margin-bottom: 20px;">Has respondido todo correctamente.</p>
        <button onclick="cerrarResultModal()" style="background-color: #2563eb;">Aceptar</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFRw66q7CfQSAzkbBE1HttpZh2LoCxna3g7PWzAcApE4y-kBQZ330CZhKkNRL3KmnvNg/exec";

    let currentUser = "";
    let currentNivel = 1;
    let nivelEnCurso = 1;
    let preguntasCargadas = [];
    let animationFrameId;

    function jsonp(url, timeoutMs = 12000) {
        return new Promise((resolve, reject) => {
            const callbackName = 'jp_' + Math.round(100000 * Math.random());
            const script = document.createElement('script');

            const timeoutId = setTimeout(() => {
                cleanUp();
                reject(new Error("Tiempo de espera agotado"));
            }, timeoutMs);

            function cleanUp() {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                clearTimeout(timeoutId);
            }

            window[callbackName] = (data) => {
                cleanUp();
                resolve(data);
            };

            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            script.onerror = () => {
                cleanUp();
                reject(new Error("Error de red al conectar con el servidor"));
            };

            document.body.appendChild(script);
        });
    }

    async function login() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const btnLogin = document.getElementById('btn-login');

        if(!u || !p) return mostrarAlerta("Atención", "Por favor ingresa usuario y contraseña", false);

        btnLogin.disabled = true;
        btnLogin.innerText = "Verificando...";

        try {
            const res = await jsonp(`${SCRIPT_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
            
            if(res.status === "success") {
                currentUser = u;
                currentNivel = parseInt(res.nivel);
                document.getElementById('welcome-msg').innerText = `¡Hola, ${res.nombreEstudiante}!`;
                document.getElementById('sec-login').classList.add('hidden');
                document.getElementById('sec-main').classList.remove('hidden');
                renderNiveles();
            } else {
                mostrarAlerta("Error", res.message, false);
            }
        } catch(e) {
            mostrarAlerta("Error", "Error al conectar con el servidor.", false);
        } finally {
            btnLogin.disabled = false;
            btnLogin.innerText = "Iniciar Sesión";
        }
    }

    function renderNiveles() {
        const grid = document.getElementById('levels-grid');
        grid.innerHTML = "";
        for(let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.style.width = "calc(20% - 8px)";
            btn.style.minWidth = "80px";
            btn.innerText = `Nivel ${i}`;
            
            if(i > currentNivel) {
                btn.disabled = true;
                btn.style.opacity = "0.4";
                btn.style.cursor = "not-allowed";
            } else {
                btn.onclick = () => abrirNivel(i);
            }
            grid.appendChild(btn);
        }
    }

    async function abrirNivel(n) {
        nivelEnCurso = n;
        document.getElementById('modal-lectura').classList.remove('hidden');
        document.getElementById('modal-reading-title').innerText = "Cargando lectura...";
        document.getElementById('modal-reading-text').innerHTML = "";
        document.getElementById('form-preguntas').innerHTML = "";
        document.getElementById('btn-submit').classList.add('hidden');

        try {
            const data = await jsonp(`${SCRIPT_URL}?action=getLectura&nivel=${n}`);
            
            if(data.status === "success") {
                document.getElementById('modal-reading-title').innerText = `Nivel ${n}: ${data.titulo}`;
                document.getElementById('modal-reading-text').innerHTML = data.texto;

                preguntasCargadas = data.preguntas;
                const form = document.getElementById('form-preguntas');
                
                preguntasCargadas.forEach((p, idx) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = "question-card";
                    
                    let optionsHTML = p.ops.map((op, opIdx) => `
                        <label class="option-label">
                            <input type="radio" name="q_${idx}" value="${opIdx}"> ${op}
                        </label>
                    `).join('');

                    qDiv.innerHTML = `
                        <span class="tag-tipo tag-${p.tipo || 'Literal'}">${p.tipo || 'Literal'}</span>
                        <p style="margin: 5px 0 10px 0;"><strong>${idx + 1}. ${p.q}</strong></p>
                        ${optionsHTML}
                    `;
                    form.appendChild(qDiv);
                });

                document.getElementById('btn-submit').classList.remove('hidden');
            } else {
                mostrarAlerta("Error", data.message, false);
                cerrarModal();
            }
        } catch(e) {
            mostrarAlerta("Error", "Error al cargar la lectura.", false);
            cerrarModal();
        }
    }

    async function enviarRespuestas() {
        let aciertos = 0;
        
        for(let i = 0; i < preguntasCargadas.length; i++) {
            const selected = document.querySelector(`input[name="q_${i}"]:checked`);
            if(!selected) return mostrarAlerta("Pregunta pendiente", `Por favor responde la pregunta ${i + 1}`, false);
            
            if(parseInt(selected.value) === parseInt(preguntasCargadas[i].correcta)) {
                aciertos++;
            }
        }

        const btnSub = document.getElementById('btn-submit');
        btnSub.disabled = true;
        btnSub.innerText = "Guardando...";

        if(aciertos === 5) {
            try {
                const res = await jsonp(`${SCRIPT_URL}?action=subirNivel&user=${encodeURIComponent(currentUser)}&nivel=${nivelEnCurso}`);
                
                if (res.status === "success") {
                    if (res.subio) {
                        currentNivel = res.nuevoNivel;
                        mostrarAlerta("¡FELICITACIONES!", "¡Respondiste 5/5 correctas! Has desbloqueado el siguiente nivel.", true);
                    } else {
                        mostrarAlerta("¡EXCELENTE TRABAJO!", "Respondiste 5/5 correctas. Ya habías completado este nivel previamente.", true);
                    }
                    renderNiveles();
                    cerrarModal();
                } else {
                    mostrarAlerta("Error", res.message || "Error al registrar el nivel.", false);
                }
            } catch(e) {
                mostrarAlerta("Error", "Error al actualizar el nivel.", false);
            }
        } else {
            mostrarAlerta("¡VUELVE A INTENTAR!", `Obtuviste ${aciertos}/5 correctas. Necesitas 5/5 para avanzar. ¡Tú puedes!`, false);
        }

        btnSub.disabled = false;
        btnSub.innerText = "Enviar Respuestas";
    }

    function cerrarModal() {
        document.getElementById('modal-lectura').classList.add('hidden');
    }

    /* POPUPS & EFECTOS DE LUCES ARTIFICIALES */
    function mostrarAlerta(titulo, mensaje, esExito) {
        const card = document.getElementById('result-card');
        const icon = document.getElementById('result-icon');
        const titleEl = document.getElementById('result-title');
        const msgEl = document.getElementById('result-msg');
        
        titleEl.innerText = titulo;
        msgEl.innerText = mensaje;

        if (esExito) {
            icon.innerText = "🌟";
            titleEl.style.color = "#15803d";
            card.classList.remove('shake');
            lanzarLuces();
        } else {
            icon.innerText = "❌";
            titleEl.style.color = "#b91c1c";
            card.classList.add('shake');
        }

        document.getElementById('modal-result').classList.remove('hidden');
    }

    function cerrarResultModal() {
        document.getElementById('modal-result').classList.add('hidden');
        detenerLuces();
    }

    /* SISTEMA DE LUCES Y FUEGOS ARTIFICIALES */
    function lanzarLuces() {
        const canvas = document.getElementById('fx-canvas');
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff0055', '#00e5ff', '#ffbe0b', '#8338ec', '#3a86ff', '#00ff66'];

        for (let i = 0; i < 120; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                dx: (Math.random() - 0.5) * 12,
                dy: (Math.random() - 0.5) * 12,
                size: Math.random() * 6 + 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.015;
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                detenerLuces();
            }
        }
        animate();
    }

    function detenerLuces() {
        const canvas = document.getElementById('fx-canvas');
        canvas.classList.add('hidden');
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }
</script>
</body>
</html>
